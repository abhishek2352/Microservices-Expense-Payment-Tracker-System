server.port=8087
spring.application.name=transaction-service
spring.datasource.url=jdbc:h2:mem:transactiondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=transaction-service-group
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.externalService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.externalService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.externalService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.externalService.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.externalService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.externalService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.externalService.waitDurationInOpenState=30s
resilience4j.circuitbreaker.instances.externalService.slowCallRateThreshold=100
resilience4j.circuitbreaker.instances.externalService.slowCallDurationThreshold=5s

# Resilience4j Retry Configuration
resilience4j.retry.instances.kafkaConsumerRetry.maxAttempts=3
resilience4j.retry.instances.kafkaConsumerRetry.waitDuration=200ms
resilience4j.retry.instances.kafkaConsumerRetry.enableExponentialBackoff=true
resilience4j.retry.instances.kafkaConsumerRetry.exponentialBackoffMultiplier=2
resilience4j.retry.instances.kafkaConsumerRetry.retryExceptions=java.io.IOException,java.util.concurrent.TimeoutException

# Resilience4j Bulkhead Configuration
resilience4j.bulkhead.instances.externalServiceBulkhead.maxThreadPoolSize=10
resilience4j.bulkhead.instances.externalServiceBulkhead.coreThreadPoolSize=2
resilience4j.bulkhead.instances.externalServiceBulkhead.queueCapacity=5

# Micrometer Prometheus Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true

# Logging Configuration with Correlation ID
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-},%X{correlationId:-}]
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n